<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b0f19"/>
  <!-- Circuit track loop -->
  <path d="M 16 32 C 16 18, 48 18, 48 32 C 48 46, 16 46, 16 32 Z" fill="none" stroke="#1f293d" stroke-width="8"/>
  <path d="M 16 32 C 16 18, 48 18, 48 32 C 48 46, 16 46, 16 32 Z" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- Stylized racing car -->
  <g transform="translate(32, 20) rotate(90)" filter="url(#glow)">
    <rect x="-6" y="-12" width="12" height="24" rx="4" fill="url(#carGrad)"/>
    <rect x="-4" y="-4" width="8" height="8" rx="2" fill="#0b0f19"/>
    <!-- Headlight beams -->
    <polygon points="-5,-12 5,-12 9,-24 -9,-24" fill="rgba(0, 240, 255, 0.4)"/>
  </g>
</svg>
